<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Proofloop pilot</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f7f7f5}body{margin:0;min-height:100vh;display:grid;place-items:center}.loader{width:min(88vw,420px);padding:32px;border:1px solid #e5e7eb;border-radius:24px;background:white;box-shadow:0 18px 60px rgba(17,24,39,.08);text-align:center}.mark{width:48px;height:48px;margin:0 auto 18px;border:5px solid #e5e7eb;border-top-color:#111827;border-radius:50%;animation:spin .8s linear infinite}h1{font-size:22px;margin:0 0 8px}p{margin:0;color:#6b7280;line-height:1.5}.error{color:#991b1b}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="loader" aria-live="polite">
    <div class="mark" aria-hidden="true"></div>
    <h1>Opening Proofloop</h1>
    <p id="status">Loading the public validation pilot…</p>
  </main>
  <script>
    (async()=>{
      if(!('DecompressionStream' in window)) throw new Error('This browser is too old for the pilot. Open the link in a current version of Chrome, Safari, Firefox or Edge.');
      const parts=[];
      for(let i=0;i<6;i++){
        const path=`pilot/site.part-${String(i).padStart(2,'0')}`;
        const response=await fetch(path,{cache:'no-store'});
        if(!response.ok) throw new Error(`Could not load pilot bundle (${response.status}).`);
        parts.push((await response.text()).trim());
      }
      const binary=atob(parts.join(''));
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      document.open();
      document.write(html);
      document.close();
    })().catch(error=>{
      document.querySelector('.mark')?.remove();
      const status=document.getElementById('status');
      status.className='error';
      status.textContent=error?.message||'The pilot could not be opened.';
    });
  </script>
</body>
</html>
