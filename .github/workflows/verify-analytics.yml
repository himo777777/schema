name: Verify Proofloop aggregate analytics transport

on:
  push:
    branches: [gh-pages]
    paths:
      - 'pilot/analytics-smoke-trigger.txt'
      - '.github/workflows/verify-analytics.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify standard CounterAPI increment, read-only access, JSON and browser CORS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue_url=$(gh issue create \
            --title "Proofloop analytics standard increment: RUNNING" \
            --body "A throwaway namespace is testing the documented standard increment endpoint, read-only retrieval and browser CORS. Production pilot counters are untouched. Run: ${run_url}")
          issue_number="${issue_url##*/}"

          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ns="proofloop-analytics-standard-smoke-20260822"
          action="transport_test"
          key="run-${nonce}"
          base="https://counterapi.com/api/${ns}/${action}/${key}"
          origin="https://himo777777.github.io"

          initial_code=$(curl -sS -D /tmp/initial.headers -o /tmp/initial.json -w "%{http_code}" -H "Origin: ${origin}" "${base}?readOnly=true" || true)
          initial_value=$(python3 -c "import json; print(int(json.load(open('/tmp/initial.json')).get('value', 0)))" 2>/dev/null || printf '%s' -1)

          increment_code=$(curl -sS -D /tmp/increment.headers -o /tmp/increment.json -w "%{http_code}" -H "Origin: ${origin}" "${base}?source=github-smoke" || true)
          increment_value=$(python3 -c "import json; print(int(json.load(open('/tmp/increment.json')).get('value', -1)))" 2>/dev/null || printf '%s' -1)

          final_code=""
          final_value=-1
          for attempt in $(seq 1 12); do
            final_code=$(curl -sS -D /tmp/final.headers -o /tmp/final.json -w "%{http_code}" -H "Origin: ${origin}" "${base}?readOnly=true" || true)
            final_value=$(python3 -c "import json; print(int(json.load(open('/tmp/final.json')).get('value', -1)))" 2>/dev/null || printf '%s' -1)
            if [ "$initial_value" -ge 0 ] && [ "$final_value" -gt "$initial_value" ]; then break; fi
            sleep 2
          done

          cors_header=$(grep -i '^access-control-allow-origin:' /tmp/final.headers 2>/dev/null | head -1 | cut -d: -f2- | tr -d '\r' | xargs || true)
          content_type=$(grep -i '^content-type:' /tmp/final.headers 2>/dev/null | head -1 | cut -d: -f2- | tr -d '\r' | xargs || true)
          increment_preview=$(tr '\n' ' ' < /tmp/increment.json | head -c 500)
          final_preview=$(tr '\n' ' ' < /tmp/final.json | head -c 500)

          cors_ok="false"
          if [ "$cors_header" = "*" ] || [ "$cors_header" = "$origin" ]; then cors_ok="true"; fi
          increment_ok="false"
          if [ "$initial_value" -ge 0 ] && { [ "$increment_value" -gt "$initial_value" ] || [ "$final_value" -gt "$initial_value" ]; }; then increment_ok="true"; fi
          http_ok="false"
          if [ "$initial_code" = "200" ] && [ "$increment_code" = "200" ] && [ "$final_code" = "200" ]; then http_ok="true"; fi
          json_ok="false"
          if [ "$increment_value" -ge 0 ] && [ "$final_value" -ge 0 ] && printf '%s' "$content_type" | grep -qi 'application/json'; then json_ok="true"; fi

          if [ "$http_ok" = "true" ] && [ "$increment_ok" = "true" ] && [ "$cors_ok" = "true" ] && [ "$json_ok" = "true" ]; then
            title="Proofloop analytics standard increment: PASS"
            result="PASS — documented standard increment and read-only retrieval work from a browser-compatible origin."
          else
            title="Proofloop analytics standard increment: FAIL"
            result="FAIL — creator traffic remains paused."
          fi

          gh issue edit "$issue_number" \
            --title "$title" \
            --body "Result: ${result}\n\nThrowaway namespace: ${ns}\nProduction counters touched: no\nInitial: HTTP ${initial_code}, value ${initial_value}\nIncrement: HTTP ${increment_code}, returned value ${increment_value}\nFinal read-only: HTTP ${final_code}, value ${final_value}\nHTTP gate: ${http_ok}\nIncrement gate: ${increment_ok}\nJSON gate: ${json_ok}\nCORS gate: ${cors_ok}\nAccess-Control-Allow-Origin: ${cors_header:-missing}\nContent-Type: ${content_type:-missing}\nRun: ${run_url}\n\nIncrement response (truncated):\n\`\`\`json\n${increment_preview}\n\`\`\`\nFinal response (truncated):\n\`\`\`json\n${final_preview}\n\`\`\`"

          [ "$http_ok" = "true" ] && [ "$increment_ok" = "true" ] && [ "$cors_ok" = "true" ] && [ "$json_ok" = "true" ]
