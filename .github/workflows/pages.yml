name: Deploy Proofloop pilot to GitHub Pages (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and verify static pilot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat pilot/site.part-* > /tmp/proofloop-site.b64
          base64 --decode /tmp/proofloop-site.b64 | gzip --decompress > _site/index.html
          echo "5d6984e7030acb725a0df73cadbddf35063fe0e9563e17e850a07de8fe11235f  _site/index.html" | sha256sum --check --strict
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
