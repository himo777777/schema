name: Verify Proofloop live pilot

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4

      - name: Verify bundled source integrity
        shell: bash
        run: |
          set -euo pipefail
          cat pilot/site.part-* > /tmp/proofloop-site.b64
          base64 --decode /tmp/proofloop-site.b64 | gzip --decompress > /tmp/proofloop-full.html
          echo "5d6984e7030acb725a0df73cadbddf35063fe0e9563e17e850a07de8fe11235f  /tmp/proofloop-full.html" | sha256sum --check --strict
          grep -q "Proofloop" /tmp/proofloop-full.html
          grep -q "Prediction mode" /tmp/proofloop-full.html

      - name: Wait for and verify public URL
        id: live
        shell: bash
        run: |
          set -euo pipefail
          url="https://himo777777.github.io/schema/"
          for attempt in $(seq 1 30); do
            status=$(curl -L -sS -o /tmp/live.html -w "%{http_code}" --max-time 20 "$url" || true)
            if [ "$status" = "200" ] && grep -q "Opening Proofloop" /tmp/live.html; then
              echo "status=PASS" >> "$GITHUB_OUTPUT"
              echo "http_status=$status" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "status=FAIL" >> "$GITHUB_OUTPUT"
          echo "http_status=${status:-unavailable}" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Report PASS
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create \
            --title "Proofloop live verification: PASS" \
            --body "Public URL: https://himo777777.github.io/schema/\n\nHTTP: ${{ steps.live.outputs.http_status }}\nCommit: ${{ github.sha }}\nBundle SHA-256: 5d6984e7030acb725a0df73cadbddf35063fe0e9563e17e850a07de8fe11235f\n\nThe public loader and the exact verified pilot bundle are available."

      - name: Report FAIL
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create \
            --title "Proofloop live verification: FAIL" \
            --body "Public URL did not pass the automated live check. Commit: ${{ github.sha }}. HTTP: ${{ steps.live.outputs.http_status }}. External distribution must remain paused."
