name: Configure and verify Proofloop live pilot

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4

      - name: Verify bundle, configure Pages source, and check public URL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue_url=$(gh issue create \
            --title "Proofloop live verification: RUNNING" \
            --body "Source integrity, Pages configuration and public HTTP verification are running. Run: ${run_url}. Distribution remains paused until PASS.")
          issue_number="${issue_url##*/}"

          bundle_ok="false"
          cat pilot/site.part-* > /tmp/proofloop-site.b64
          if base64 --decode /tmp/proofloop-site.b64 | gzip --decompress > /tmp/proofloop-full.html \
            && echo "5d6984e7030acb725a0df73cadbddf35063fe0e9563e17e850a07de8fe11235f  /tmp/proofloop-full.html" | sha256sum --check --strict \
            && grep -q "Proofloop" /tmp/proofloop-full.html \
            && grep -q "Prediction mode" /tmp/proofloop-full.html; then
            bundle_ok="true"
          fi

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          get_code=$(curl -sS -o /tmp/pages-before.json -w "%{http_code}" "${auth[@]}" "$api" || true)
          payload='{"source":{"branch":"gh-pages","path":"/"}}'
          if [ "$get_code" = "404" ]; then method="POST"; else method="PUT"; fi
          config_code=$(curl -sS -o /tmp/pages-config.json -w "%{http_code}" -X "$method" "${auth[@]}" -H "Content-Type: application/json" -d "$payload" "$api" || true)
          config_body=$(tr '\n' ' ' < /tmp/pages-config.json 2>/dev/null | head -c 1800)

          live_status=""
          live_ok="false"
          curl_error=""
          for attempt in $(seq 1 36); do
            live_status=$(curl -L -sS -o /tmp/live.html -w "%{http_code}" --max-time 20 "https://himo777777.github.io/schema/" 2>/tmp/curl-error || true)
            curl_error=$(tr '\n' ' ' < /tmp/curl-error 2>/dev/null | head -c 500)
            if [ "$live_status" = "200" ] && grep -q "Opening Proofloop" /tmp/live.html; then
              live_ok="true"
              break
            fi
            sleep 10
          done

          if [ "$bundle_ok" = "true" ] && [ "$live_ok" = "true" ]; then
            title="Proofloop live verification: PASS"
            result="PASS — exact bundle verified and public loader returned HTTP 200."
          else
            title="Proofloop live verification: FAIL"
            result="FAIL — distribution remains paused."
          fi

          gh issue edit "$issue_number" \
            --title "$title" \
            --body "Result: ${result}\n\nBundle integrity: ${bundle_ok}\nPages GET before configuration: ${get_code}\nConfiguration request: ${method} → HTTP ${config_code}\nLive HTTP: ${live_status:-unavailable}\nCurl error: ${curl_error:-none}\nCommit: ${GITHUB_SHA}\nRun: ${run_url}\n\nAPI response (truncated):\n\`\`\`json\n${config_body}\n\`\`\`\n\nPublic URL: https://himo777777.github.io/schema/"

          [ "$bundle_ok" = "true" ] && [ "$live_ok" = "true" ]
