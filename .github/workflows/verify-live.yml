name: Verify Proofloop pilot readiness

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4

      - name: Verify public build and aggregate analytics transport
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          expected_sha="5d6984e7030acb725a0df73cadbddf35063fe0e9563e17e850a07de8fe11235f"
          public_base="https://himo777777.github.io/schema"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue_url=$(gh issue create \
            --title "Proofloop pilot readiness: RUNNING" \
            --body "Public bundle and throwaway aggregate-analytics transport are being verified. Production pilot counters are not touched. Run: ${run_url}")
          issue_number="${issue_url##*/}"

          # 1. Verify exact local bundle.
          local_bundle_ok="false"
          cat pilot/site.part-* > /tmp/proofloop-local.b64
          if base64 --decode /tmp/proofloop-local.b64 | gzip --decompress > /tmp/proofloop-local.html \
            && echo "${expected_sha}  /tmp/proofloop-local.html" | sha256sum --check --strict \
            && grep -qi "Proofloop" /tmp/proofloop-local.html \
            && grep -qi "Prediction Mode" /tmp/proofloop-local.html; then
            local_bundle_ok="true"
          fi

          # 2. Read Pages state. Configure only if no site exists.
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          pages_get_code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" "${auth[@]}" "$api" || true)
          pages_body=$(tr '\n' ' ' < /tmp/pages.json 2>/dev/null | head -c 1800)
          if [ "$pages_get_code" = "404" ]; then
            payload='{"source":{"branch":"gh-pages","path":"/"}}'
            curl -sS -o /tmp/pages-config.json -X POST "${auth[@]}" -H "Content-Type: application/json" -d "$payload" "$api" || true
          fi

          # 3. Verify the loader and every public bundle part reconstruct to the exact SHA.
          loader_ok="false"
          remote_bundle_ok="false"
          loader_status=""
          remote_error=""
          for attempt in $(seq 1 36); do
            loader_status=$(curl -L -sS -o /tmp/proofloop-loader.html -w "%{http_code}" --max-time 20 "${public_base}/" 2>/tmp/loader-error || true)
            if [ "$loader_status" = "200" ] && grep -q "Opening Proofloop" /tmp/proofloop-loader.html; then
              loader_ok="true"
            fi

            : > /tmp/proofloop-remote.b64
            remote_assets_ok="true"
            for i in $(seq 0 5); do
              part=$(printf "%02d" "$i")
              part_status=$(curl -L -sS -o "/tmp/site.part-${part}" -w "%{http_code}" --max-time 20 "${public_base}/pilot/site.part-${part}" 2>/tmp/part-error || true)
              if [ "$part_status" != "200" ]; then
                remote_assets_ok="false"
                remote_error="part-${part} HTTP ${part_status}: $(tr '\n' ' ' < /tmp/part-error | head -c 300)"
                break
              fi
              tr -d '\r\n' < "/tmp/site.part-${part}" >> /tmp/proofloop-remote.b64
            done

            if [ "$remote_assets_ok" = "true" ] \
              && base64 --decode /tmp/proofloop-remote.b64 | gzip --decompress > /tmp/proofloop-remote.html \
              && echo "${expected_sha}  /tmp/proofloop-remote.html" | sha256sum --check --strict \
              && grep -qi "Proofloop" /tmp/proofloop-remote.html \
              && grep -qi "Prediction Mode" /tmp/proofloop-remote.html; then
              remote_bundle_ok="true"
            fi

            if [ "$loader_ok" = "true" ] && [ "$remote_bundle_ok" = "true" ]; then break; fi
            sleep 10
          done

          # 4. Smoke-test CounterAPI with an isolated key: read, trackOnly increment, read.
          analytics_ns="proofloop-analytics-smoke-20260822"
          analytics_action="transport_test"
          analytics_key="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          counter_url="https://counterapi.com/api/${analytics_ns}/${analytics_action}/${analytics_key}"
          origin="https://himo777777.github.io"

          initial_code=$(curl -sS -D /tmp/initial.headers -o /tmp/initial.json -w "%{http_code}" -H "Origin: ${origin}" "${counter_url}?readOnly=true" || true)
          initial_value=$(python3 - <<'PY'
import json
try:
    with open('/tmp/initial.json') as f:
        print(int(json.load(f).get('value', 0)))
except Exception:
    print(-1)
PY
          )

          track_code=$(curl -sS -D /tmp/track.headers -o /tmp/track.body -w "%{http_code}" -H "Origin: ${origin}" "${counter_url}?trackOnly=true&source=github-smoke" || true)

          final_code=""
          final_value=-1
          for attempt in $(seq 1 12); do
            final_code=$(curl -sS -D /tmp/final.headers -o /tmp/final.json -w "%{http_code}" -H "Origin: ${origin}" "${counter_url}?readOnly=true" || true)
            final_value=$(python3 - <<'PY'
import json
try:
    with open('/tmp/final.json') as f:
        print(int(json.load(f).get('value', -1)))
except Exception:
    print(-1)
PY
            )
            if [ "$initial_value" -ge 0 ] && [ "$final_value" -gt "$initial_value" ]; then break; fi
            sleep 2
          done

          cors_header=$(grep -i '^access-control-allow-origin:' /tmp/final.headers 2>/dev/null | head -1 | cut -d: -f2- | xargs || true)
          content_type=$(grep -i '^content-type:' /tmp/final.headers 2>/dev/null | head -1 | cut -d: -f2- | xargs || true)
          analytics_http_ok="false"
          if [ "$initial_code" = "200" ] && { [ "$track_code" = "200" ] || [ "$track_code" = "204" ]; } && [ "$final_code" = "200" ]; then analytics_http_ok="true"; fi
          analytics_increment_ok="false"
          if [ "$initial_value" -ge 0 ] && [ "$final_value" -gt "$initial_value" ]; then analytics_increment_ok="true"; fi
          analytics_cors_ok="false"
          if [ "$cors_header" = "*" ] || [ "$cors_header" = "$origin" ]; then analytics_cors_ok="true"; fi
          analytics_json_ok="false"
          if [ "$final_value" -ge 0 ] && printf '%s' "$content_type" | grep -qi 'application/json'; then analytics_json_ok="true"; fi
          analytics_ok="false"
          if [ "$analytics_http_ok" = "true" ] && [ "$analytics_increment_ok" = "true" ] && [ "$analytics_cors_ok" = "true" ] && [ "$analytics_json_ok" = "true" ]; then analytics_ok="true"; fi

          # 5. Fail closed.
          if [ "$local_bundle_ok" = "true" ] && [ "$loader_ok" = "true" ] && [ "$remote_bundle_ok" = "true" ] && [ "$analytics_ok" = "true" ]; then
            title="Proofloop pilot readiness: PASS"
            result="PASS — exact public build and browser-compatible aggregate analytics transport are operational."
          else
            title="Proofloop pilot readiness: FAIL"
            result="FAIL — creator outreach remains paused."
          fi

          final_preview=$(tr '\n' ' ' < /tmp/final.json 2>/dev/null | head -c 500)
          gh issue edit "$issue_number" \
            --title "$title" \
            --body "Result: ${result}\n\n### Public build\nLocal bundle: ${local_bundle_ok}\nPublic loader: ${loader_ok} (HTTP ${loader_status:-unavailable})\nPublic remote bundle: ${remote_bundle_ok}\nRemote error: ${remote_error:-none}\nApproved SHA-256: ${expected_sha}\nPages settings GET: HTTP ${pages_get_code}\n\n### Aggregate analytics transport\nThrowaway namespace: ${analytics_ns}\nProduction pilot counters touched: no\nInitial: HTTP ${initial_code}, value ${initial_value}\nTrack-only: HTTP ${track_code}\nFinal: HTTP ${final_code}, value ${final_value}\nHTTP gate: ${analytics_http_ok}\nIncrement gate: ${analytics_increment_ok}\nJSON gate: ${analytics_json_ok}\nCORS gate: ${analytics_cors_ok}\nAccess-Control-Allow-Origin: ${cors_header:-missing}\nContent-Type: ${content_type:-missing}\nFinal response: ${final_preview:-empty}\n\nCommit: ${GITHUB_SHA}\nRun: ${run_url}\nPublic URL: ${public_base}/\n\nPages settings (truncated):\n\`\`\`json\n${pages_body}\n\`\`\`"

          [ "$local_bundle_ok" = "true" ] && [ "$loader_ok" = "true" ] && [ "$remote_bundle_ok" = "true" ] && [ "$analytics_ok" = "true" ]
